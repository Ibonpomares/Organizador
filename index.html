<style>

00vw - 554px)/2));bottom:calc(21px + env(safe-area-inset-bottom));width:59px;height:59px;border:0;border-radius:20px;background:var(--coral);color:#fff;font-size:30px;box-shadow:0 9px 24px #f0715970}.add:active{transform:scale(.96)}dialog{width:min(94vw,460px);max-height:92vh;overflow:auto;padding:21px;border:0;border-radius:24px;box-shadow:0 18px 55px #0004}dialog::backdrop{background:#14271f88}dialog h2{margin:0;font-size:21px;letter-spacing:-.4px}.form-intro{font-size:12px;color:var(--muted);margin:3px 0 4px}form{display:grid;gap:11px}.field{display:grid;gap:5px;font-size:11px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fafbf9;color:var(--ink);font-size:14px}.field textarea{height:60px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.inline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.inline input{width:17px;height:17px;accent-color:var(--ink)}.form-actions{margin-top:2px}.form-actions>div{gap:7px}.form-actions button{border:0;border-radius:11px;padding:11px 13px;font-size:13px}.cancel{background:#e9ece8}.save{background:var(--ink);color:#fff;font-weight:750}.delete{background:none;color:#bd5147}.hide{display:none!important}.sheet-actions{display:grid;gap:9px}.sheet-actions button{padding:13px;text-align:left;background:#f4f6f2;border:0;border-radius:12px}.toast{position:fixed;z-index:10;left:50%;bottom:calc(91px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 15px;background:#183a2c;color:#fff;border-radius:20px;font-size:12px;box-shadow:var(--shadow)}@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.tabs button{font-size:11px}.item-meta .badge:last-child{display:none}.year{gap:5px}.mini{padding:6px}}
</style></head><body><main class="app">
<header><div><p class="greeting" id="today"></p><h1>Organiza</h1></div><div class="top-actions"><button class="icon-btn" id="backup" aria-label="Copia de seguridad" title="Copia de seguridad">↥</button><div class="avatar">O</div></div></header>
<nav class="tabs" aria-label="Vista del calendario"><button class="active" data-v="day">Día</button><button data-v="week">Semana</button><button data-v="month">Mes</button><button data-v="year">Año</button></nav>

<div class="section"><h2 id="heading">Plan de hoy</h2><div class="section-actions"><button id="todayBtn">Hoy</button><button id="clear">Limpiar hechas</button></div></div><section id="items" class="items"></section>
</main><button class="add" id="add" aria-label="Añadir una tarea o plan">+</button>
<dialog id="editor"><form id="form"><h2 id="formTitle">Nuevo plan</h2><p class="form-intro">Organiza una tarea, cita o hábito en segundos.</p>

<label class="field">Notas<textarea id="notes" maxlength="300" placeholder="Detalles, lista, personas o recordatorio"></textarea></label>
<div class="row"><label class="field">Fecha<input id="when" type="date" required></label><label class="field">Hora<input id="time" type="time"></label></div>
<div class="row"><label class="field">Duración<select id="duration"><option value="">Sin duración</option><option>15 min</option><option>30 min</option><option>45 min</option><option>1 hora</option><option>1 h 30 min</option><option>2 horas</option></select></label><label class="field">Lugar<input id="place" maxlength="60" placeholder="Opcional"></label></div>

<dialog id="backupDialog"><h2>Copia de seguridad</h2><p class="form-intro">Guarda tus planes en un archivo o restaura una copia anterior.</p><div class="sheet-actions"><button id="export">⬇️ Descargar copia de seguridad</button><button id="import">⬆️ Restaurar desde un archivo</button><button id="closeBackup">Cerrar</button></div><input class="hide" type="file" id="fileInput" accept="application/json,.json"></dialog><input class="hide" type="file" id="importInput" accept="application/json,.json"><div id="toast" class="toast hide" role="status"></div>
<script>
(()=>{'use strict';
const q=s=>document.querySelector(s),calendar=q('#calendar'),list=q('#items'),editor=q('#editor'),dbKey='organiza-v2';let view='day',focus=new Date(),editingId=null,plans=readPlans();focus.setHours(0,0,0,0);
const labels={work:'Trabajo',family:'Familia',sport:'Ejercicio',personal:'Personal'},repeats={once:'Una vez',daily:'Cada día',weekly:'Cada semana',monthly:'Cada mes',yearly:'Cada año'},kinds={task:'Tarea',event:'Cita',habit:'Hábito'};
function readPlans(){try{const d=JSON.parse(localStorage.getItem(dbKey)||'[]');return Array.isArray(d)?d.map(p=>({priority:'normal',kind:'task',duration:'',place:'',...p})):[]}catch{return []}}
function persist(){try{localStorage.setItem(dbKey,JSON.stringify(plans));return true}catch{toast('No se pudieron guardar los cambios. Libera espacio en Safari.');return false}}
function dayKey(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}function asDate(value){return value instanceof Date?new Date(value):new Date(value+'T12:00:00')}function equalDay(a,b){return dayKey(a)===dayKey(b)}function monday(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function occurs(p,d){if(!p.date)return false;const start=asDate(p.date),at=asDate(d);if(at<start)return false;const delta=Math.round((Date.UTC(at.getFullYear(),at.getMonth(),at.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);switch(p.repeat||'once'){case'daily':return true;case'weekly':return delta%7===0;case'monthly':return at.getDate()===start.getDate();case'yearly':return at.getDate()===start.getDate()&&at.getMonth()===start.getMonth();default:return equalDay(start,at)}}
function matchesView(p){if(view==='day')return occurs(p,focus);let dates=[];if(view==='week'){let d=monday(focus);dates=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x})}else if(view==='month'){let y=focus.getFullYear(),m=focus.getMonth();dates=Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>new Date(y,m,i+1))}else{let y=focus.getFullYear();dates=Array.from({length:365+(new Date(y,1,29).getMonth()===1?1:0)},(_,i)=>new Date(y,0,i+1))}return dates.some(d=>occurs(p,d))}
function hasPlan(d){return plans.some(p=>occurs(p,d))}function dateButton(d,extra=''){return `<button class="${extra}" data-date="${dayKey(d)}">${d.getDate()}${hasPlan(d)?'<i></i>':''}</button>`}
function drawCalendar(){const y=focus.getFullYear(),m=focus.getMonth();if(view==='day'||view==='week'){const start=monday(focus);calendar.className='week';calendar.innerHTML=['L','M','X','J','V','S','D'].map((n,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return `<button data-date="${dayKey(d)}" class="${equalDay(d,focus)?'active':''}">${n}<b>${d.getDate()}${hasPlan(d)?' ·':''}</b></button>`}).join('')}else if(view==='month'){let first=new Date(y,m,1),start=monday(first),html=['L','M','X','J','V','S','D'].map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);html+=`<button class="date ${d.getMonth()!==m?'off':''} ${equalDay(d,focus)?'today':''}" data-date="${dayKey(d)}">${d.getDate()}${hasPlan(d)?'<i></i>':''}</button>`}calendar.className='month';calendar.innerHTML=html}else{calendar.className='year';calendar.innerHTML=Array.from({length:12},(_,mo)=>{const n=new Date(y,mo+1,0).getDate(),days=Array.from({length:n},(_,i)=>{const d=new Date(y,mo,i+1);return `<span class="${hasPlan(d)?'planned':''}">${i+1}</span>`}).join('');return `<article class="mini"><button data-month="${mo}">${new Intl.DateTimeFormat('es-ES',{month:'long'}).format(new Date(y,mo,1))}</button><div class="days">${days}</div></article>`}).join('')}
calendar.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{focus=asDate(b.dataset.date);if(view==='month')view='day';syncTabs();render()});calendar.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{focus.setMonth(Number(b.dataset.month));view='month';syncTabs();render()})}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(s){return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}).format(asDate(s))}
function render(){const f=view==='year'?{year:'numeric'}:view==='month'?{month:'long',year:'numeric'}:view==='week'?{day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long'};q('#period').textContent=new Intl.DateTimeFormat('es-ES',f).format(focus);drawCalendar();q('#heading').textContent={day:'Tu día',week:'Tu semana',month:'Este mes',year:'Este año'}[view];q('#overviewLabel').textContent={day:'Tu día en equilibrio',week:'Tu semana en equilibrio',month:'Tu mes en equilibrio',year:'Tu año en equilibrio'}[view];const filter=q('#filter').value,needle=q('#search').value.trim().toLocaleLowerCase('es');let result=plans.filter(p=>matchesView(p)&&(filter==='all'||p.category===filter)&&(!needle||`${p.title} ${p.notes||''} ${p.place||''}`.toLocaleLowerCase('es').includes(needle))).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));list.innerHTML=result.length?result.map(p=>`<article class="item ${safe(p.category)} ${p.done?'done':''} ${p.priority==='high'?'priority-high':''}" data-id="${p.id}"><div class="item-main"><input class="check" type="checkbox" aria-label="Marcar completada" ${p.done?'checked':''}><div class="item-copy"><div class="item-title">${safe(p.title)}</div><div class="item-meta"><span>${p.time?safe(p.time):'Sin hora'}</span><span>·</span><span>${dateLabel(p.date)}</span>${p.duration?`<span class="badge">${safe(p.duration)}</span>`:''}${p.place?`<span class="badge">⌖ ${safe(p.place)}</span>`:''}<span class="badge">${labels[p.category]||'Personal'}</span>${p.repeat&&p.repeat!=='once'?`<span class="badge">↻ ${repeats[p.repeat]}</span>`:''}${p.kind&&p.kind!=='task'?`<span class="badge">${kinds[p.kind]}</span>`:''}${p.priority==='high'?'<span class="badge">★ Importante</span>':''}</div></div><button class="tiny edit" aria-label="Editar">···</button></div>${p.notes?`<p class="item-note">${safe(p.notes)}</p>`:''}</article>`).join(''):'<div class="empty">No hay planes que coincidan.<br>Añade uno con + o cambia la búsqueda.</div>';list.querySelectorAll('.item').forEach(el=>{el.querySelector('.check').onchange=e=>{const p=plans.find(x=>String(x.id)===el.dataset.id);if(p){p.done=e.target.checked;persist();render()}};el.querySelector('.edit').onclick=()=>open(plans.find(x=>String(x.id)===el.dataset.id))});const done=plans.filter(p=>p.done).length,total=plans.length,openCount=total-done;q('#progressBar').style.width=total?`${done/total*100}%`:'0%';q('#progressText').textContent=total?`${done} de ${total} completadas`:'Empieza por añadir algo que te importe';q('#statOpen').textContent=`${openCount} pendientes`;q('#statEvents').textContent=`${total} en total`;q('#overviewTitle').textContent=total?(openCount===0?'¡Todo al día!':'Paso a paso, lo tienes'):'Haz espacio para lo importante'}
function syncTabs(){q('.tabs .active')?.classList.remove('active');q(`[data-v="${view}"]`).classList.add('active')}function open(p=null){editingId=p?String(p.id):null;q('#form').reset();q('#formTitle').textContent=p?'Editar plan':'Nuevo plan';q('#delete').classList.toggle('hide',!p);q('#when').value=p?.date||dayKey(focus);q('#time').value=p?.time||'';q('#title').value=p?.title||'';q('#notes').value=p?.notes||'';q('#duration').value=p?.duration||'';q('#place').value=p?.place||'';q('#category').value=p?.category||'personal';q('#repeat').value=p?.repeat||'once';q('#priority').value=p?.priority||'normal';q('#kind').value=p?.kind||'task';editor.showModal();setTimeout(()=>q('#title').focus(),80)}function toast(message){const t=q('#toast');t.textContent=message;t.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hide'),2600)}
q('.tabs').onclick=e=>{const v=e.target.dataset.v;if(!v)return;view=v;syncTabs();render()};q('#prev').onclick=()=>{if(view==='day')focus.setDate(focus.getDate()-1);else if(view==='week')focus.setDate(focus.getDate()-7);else if(view==='month')focus.setMonth(focus.getMonth()-1);else focus.setFullYear(focus.getFullYear()-1);render()};q('#next').onclick=()=>{if(view==='day')focus.setDate(focus.getDate()+1);else if(view==='week')focus.setDate(focus.getDate()+7);else if(view==='month')focus.setMonth(focus.getMonth()+1);else focus.setFullYear(focus.getFullYear()+1);render()};q('#todayBtn').onclick=()=>{focus=new Date();focus.setHours(0,0,0,0);view='day';syncTabs();render()};q('#add').onclick=()=>open();q('#cancel').onclick=()=>editor.close();q('#form').onsubmit=e=>{e.preventDefault();const old=plans.find(p=>String(p.id)===editingId),p=old||{id:Date.now(),done:false};Object.assign(p,{title:q('#title').value.trim(),notes:q('#notes').value.trim(),date:q('#when').value,time:q('#time').value,duration:q('#duration').value,place:q('#place').value.trim(),category:q('#category').value,repeat:q('#repeat').value,priority:q('#priority').value,kind:q('#kind').value});if(!old)plans.push(p);persist();editor.close();render();toast(old?'Cambios guardados':'Añadido a tu agenda')};q('#delete').onclick=()=>{plans=plans.filter(p=>String(p.id)!==editingId);persist();editor.close();render();toast('Plan eliminado')};q('#clear').onclick=()=>{const n=plans.filter(p=>p.done).length;if(!n)return toast('No hay tareas completadas que limpiar');plans=plans.filter(p=>!p.done);persist();render();toast(`${n} completadas eliminadas`)};q('#search').oninput=render;q('#filter').onchange=render;
q('#backup').onclick=()=>q('#backupDialog').showModal();q('#closeBackup').onclick=()=>q('#backupDialog').close();q('#export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Organiza',version:1,exportedAt:new Date().toISOString(),plans},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`organiza-copia-${dayKey(new Date())}.json`;a.click();URL.revokeObjectURL(url);toast('Copia descargada')};q('#import').onclick=()=>q('#importInput').click();q('#importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),incoming=Array.isArray(parsed)?parsed:parsed.plans;if(!Array.isArray(incoming)||incoming.some(p=>!p.title||!p.date))throw Error();if(!confirm(`Se importarán ${incoming.length} planes y se conservarán los actuales. ¿Continuar?`))return;const ids=new Set(plans.map(p=>String(p.id)));incoming.forEach(p=>{if(ids.has(String(p.id)))p.id=Date.now()+Math.random();plans.push(p)});persist();render();toast('Copia restaurada')}catch{toast('El archivo no parece una copia válida')}finally{e.target.value=''}};
q('#today').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
