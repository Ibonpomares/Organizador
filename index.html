<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><title>Organiza</title><style>:root{--ink:#172b24;--muted:#718079;--bg:#f7f7f2;--line:#e2e6df;--coral:#f36f58}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:var(--ink)}.app{max-width:560px;margin:auto;padding:calc(17px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom))}header,.nav,.head,.actions{display:flex;align-items:center;justify-content:space-between}.sub{margin:0;color:var(--muted);font-size:13px;text-transform:capitalize}h1{margin:2px 0;font-size:29px}.avatar{background:var(--ink);color:white;border-radius:50%;width:41px;height:41px;display:grid;place-items:center;font-weight:bold}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;background:#e8eae4;border-radius:14px;margin:20px 0}.tabs button,.nav button,.add,.section button{border:0;background:transparent;cursor:pointer}.tabs button{padding:9px 2px;border-radius:10px;color:var(--muted);font-weight:700}.tabs .active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}.nav{margin:0 0 13px}.nav button{font-size:20px;background:white;border:1px solid var(--line);border-radius:10px;width:32px;height:32px}.nav strong{text-transform:capitalize}.week,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week button{border:0;background:transparent;padding:4px;color:var(--muted);font-size:10px;font-weight:700}.week b{display:grid;place-items:center;width:31px;height:31px;margin:4px auto 0;border-radius:50%;color:var(--ink);font-size:14px}.week .active{color:var(--coral)}.week .active b{background:var(--coral);color:white}.month .dow{text-align:center;color:var(--muted);font-size:10px}.date{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;position:relative}.date.off{opacity:.3}.date.today{outline:2px solid var(--coral)}.date i{position:absolute;width:5px;height:5px;background:var(--coral);border-radius:50%;bottom:4px;left:calc(50% - 2px)}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px}.mini h3{margin:0 0 7px;font-size:12px;text-transform:capitalize}.mini div{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}.mini span{text-align:center;font-size:8px}.mini .dot{color:var(--coral);font-weight:bold}.summary{margin:18px 0;background:#173c30;color:#fff;border-radius:20px;padding:17px}.summary p{margin:0;color:#bdd7ca;font-size:13px}.summary h2{margin:5px 0;font-size:20px}.bar{height:7px;background:#42695b;border-radius:9px;margin-top:14px}.bar i{display:block;height:100%;border-radius:9px;background:#a7efce}.section{margin:18px 0 10px}.section h2{font-size:18px;margin:0}.section button{color:var(--coral);font-weight:bold;font-size:12px}.items{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--coral);border-radius:14px;padding:11px}.item.work{border-color:#5794ef;background:#e4efff}.item.family{border-color:#deb224;background:#fff3c8}.item.sport{border-color:#40ae7e;background:#daf2e7}.item.personal{border-color:#a77be3;background:#eee4fd}.item time{font-size:11px;color:var(--muted);min-width:37px}.item label{flex:1;font-size:14px}.item small{font-size:10px;background:#ffffffa8;border-radius:10px;padding:3px 6px}.check{width:19px;height:19px;accent-color:var(--coral)}.done label{text-decoration:line-through;color:var(--muted)}.empty{text-align:center;padding:24px;color:var(--muted);border:1px dashed #cbd3cc;border-radius:14px;font-size:13px}.add{position:fixed;right:max(20px,calc((100vw - 525px)/2));bottom:calc(22px + env(safe-area-inset-bottom));background:var(--coral);color:#fff;width:58px;height:58px;border-radius:19px;font-size:30px;box-shadow:0 8px 24px #f36f5870}dialog{border:0;border-radius:22px;width:min(92vw,430px);padding:21px;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#172b2488}dialog h2{margin:0 0 14px}form{display:grid;gap:10px}.field{font-size:12px;color:var(--muted);font-weight:bold;display:grid;gap:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fafbf9;font:inherit}textarea{height:58px}.actions{margin-top:4px}.actions button{border:0;border-radius:10px;padding:11px 13px}.cancel{background:#e9ece7}.save{background:var(--ink);color:white;font-weight:bold}.delete{color:#c84e41;background:none}.hide{display:none}</style></head><body><main class="app"><header><div><p class="sub" id="today"></p><h1>Organiza</h1></div><div class="avatar">IP</div></header><nav class="tabs"><button class="active" data-v="day">Día</button><button data-v="week">Semana</button><button data-v="month">Mes</button><button data-v="year">Año</button></nav><div class="nav"><button id="prev">‹</button><strong id="period"></strong><button id="next">›</button></div><section id="calendar"></section><section class="summary"><p id="summaryLabel">Tu día en equilibrio</p><h2>Todo bajo control</h2><div class="bar"><i id="bar"></i></div></section><div class="section"><h2 id="heading">Plan de hoy</h2><button id="clear">Limpiar hechas</button></div><section id="items" class="items"></section></main><button class="add" id="add">+</button><dialog id="dialog"><form id="form"><h2 id="formHead">Nuevo plan</h2><label class="field">Título<input id="title" required maxlength="80" placeholder="¿Qué tienes que hacer?"></label><label class="field">Notas<textarea id="notes" placeholder="Opcional"></textarea></label><div class="row"><label class="field">Fecha<input id="when" type="date" required></label><label class="field">Hora<input id="time" type="time" value="09:00"></label></div><div class="row"><label class="field">Categoría<select id="category"><option value="work">Trabajo</option><option value="family">Familia / hijos</option><option value="sport">Ejercicio</option><option value="personal">Personal</option></select></label><label class="field">Repetir<select id="repeat"><option value="once">Solo este día</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option><option value="yearly">Cada año</option></select></label></div><div class="actions"><button id="del" class="delete hide" type="button">Eliminar</button><span><button id="cancel" class="cancel" type="button">Cancelar</button><button class="save">Guardar</button></span></div></form></dialog><script>
const q=s=>document.querySelector(s),C=q('#calendar'),I=q('#items'),D=q('#dialog'),K='organiza-v2';let view='day',focus=new Date(),edit=null,plans=JSON.parse(localStorage.getItem(K)||'[]');focus.setHours(0,0,0,0);const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},toDate=x=>x instanceof Date?new Date(x):new Date(x+'T12:00:00'),same=(a,b)=>iso(a)===iso(b),week=d=>{let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x},cat={work:'Trabajo',family:'Familia',sport:'Ejercicio',personal:'Personal'},repeat={once:'día',weekly:'semana',monthly:'mes',yearly:'año'};function save(){localStorage.setItem(K,JSON.stringify(plans))}function occurs(p,d){const a=toDate(p.date),b=toDate(d);return p.repeat==='once'?same(a,b):p.repeat==='weekly'?b>=a&&a.getDay()===b.getDay():p.repeat==='monthly'?b>=a&&a.getDate()===b.getDate():b>=a&&a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}function shown(p){if(view==='day')return occurs(p,focus);if(view==='week')return [...Array(7)].some((_,i)=>{let d=week(focus);d.setDate(d.getDate()+i);return occurs(p,d)});if(view==='month')return [...Array(new Date(focus.getFullYear(),focus.getMonth()+1,0).getDate())].some((_,i)=>occurs(p,new Date(focus.getFullYear(),focus.getMonth(),i+1)));return [...Array(12)].some((_,m)=>[...Array(new Date(focus.getFullYear(),m+1,0).getDate())].some((_,i)=>occurs(p,new Date(focus.getFullYear(),m,i+1))))}function renderCal(){let y=focus.getFullYear(),m=focus.getMonth();if(view==='day'||view==='week'){const s=week(focus);C.className='week';C.innerHTML=['L','M','X','J','V','S','D'].map((n,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);return `<button data-d="${iso(d)}" class="${same(d,focus)?'active':''}">${n}<b>${d.getDate()}</b></button>`}).join('')}else if(view==='month'){let first=new Date(y,m,1),s=week(first),h=['L','M','X','J','V','S','D'].map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);h+=`<button data-d="${iso(d)}" class="date ${d.getMonth()!=m?'off':''} ${same(d,focus)?'today':''}">${d.getDate()}${plans.some(p=>occurs(p,d))?'<i></i>':''}</button>`}C.className='month';C.innerHTML=h}else{C.className='year';C.innerHTML=Array.from({length:12},(_,mo)=>{let n=new Date(y,mo+1,0).getDate(),days=Array.from({length:n},(_,i)=>{let d=new Date(y,mo,i+1);return `<span class="${plans.some(p=>occurs(p,d))?'dot':''}">${i+1}</span>`}).join('');return `<article class="mini"><h3>${new Intl.DateTimeFormat('es-ES',{month:'short'}).format(new Date(y,mo))}</h3><div>${days}</div></article>`}).join('')}C.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{focus=toDate(b.dataset.d);view='day';sync();render()})}function esc(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function render(){let f=view==='year'?{year:'numeric'}:view==='month'?{month:'long',year:'numeric'}:view==='week'?{day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long'};q('#period').textContent=new Intl.DateTimeFormat('es-ES',f).format(focus);renderCal();let x=plans.filter(shown).sort((a,b)=>a.time.localeCompare(b.time));q('#heading').textContent={day:'Plan de hoy',week:'Planes de la semana',month:'Planes del mes',year:'Planes del año'}[view];q('#summaryLabel').textContent={day:'Tu día en equilibrio',week:'Tu semana en equilibrio',month:'Tu mes en equilibrio',year:'Tu año en equilibrio'}[view];I.innerHTML=x.length?x.map(p=>`<article data-id="${p.id}" class="item ${p.category} ${p.done?'done':''}"><input class="check" type="checkbox" ${p.done?'checked':''}><time>${p.time}</time><label>${esc(p.title)}${p.notes?`<br><small>${esc(p.notes)}</small>`:''}</label><small>${cat[p.category]} · ${repeat[p.repeat]}</small></article>`).join(''):'<div class="empty">No hay planes aquí todavía.<br>Pulsa + para añadir uno.</div>';I.querySelectorAll('.item').forEach(e=>{e.querySelector('.check').onchange=a=>{let p=plans.find(p=>p.id==e.dataset.id);p.done=a.target.checked;save();render()};e.onclick=a=>{if(!a.target.matches('.check'))open(plans.find(p=>p.id==e.dataset.id))}});let n=plans.length?plans.filter(p=>p.done).length/plans.length*100:0;q('#bar').style.width=n+'%'}function sync(){q('.tabs .active').classList.remove('active');q(`[data-v="${view}"]`).classList.add('active')}function open(p){edit=p||null;q('#form').reset();q('#formHead').textContent=p?'Editar plan':'Nuevo plan';q('#del').classList.toggle('hide',!p);q('#when').value=p?p.date:iso(focus);q('#time').value=p?p.time:'09:00';if(p){q('#title').value=p.title;q('#notes').value=p.notes||'';q('#category').value=p.category;q('#repeat').value=p.repeat}D.showModal()}q('.tabs').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;sync();render()}};q('#prev').onclick=()=>{view==='day'?focus.setDate(focus.getDate()-1):view==='week'?focus.setDate(focus.getDate()-7):view==='month'?focus.setMonth(focus.getMonth()-1):focus.setFullYear(focus.getFullYear()-1);render()};q('#next').onclick=()=>{view==='day'?focus.setDate(focus.getDate()+1):view==='week'?focus.setDate(focus.getDate()+7):view==='month'?focus.setMonth(focus.getMonth()+1):focus.setFullYear(focus.getFullYear()+1);render()};q('#add').onclick=()=>open();q('#cancel').onclick=()=>D.close();q('#form').onsubmit=e=>{e.preventDefault();let p=edit||{id:Date.now(),done:false};Object.assign(p,{title:q('#title').value.trim(),notes:q('#notes').value.trim(),date:q('#when').value,time:q('#time').value,category:q('#category').value,repeat:q('#repeat').value});if(!edit)plans.push(p);save();D.close();render()};q('#del').onclick=()=>{plans=plans.filter(p=>p.id!==edit.id);save();D.close();render()};q('#clear').onclick=()=>{plans=plans.filter(p=>!p.done);save();render()};q('#today').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());render();
</script></body></html>
